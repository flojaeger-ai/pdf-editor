<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#b23a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PDF" />
  <meta name="format-detection" content="telephone=no" />
  <title>PDF bearbeiten</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      color-scheme: light;
      --brand: #b23a2e;
      --brand-d: #8f2c22;
      --ink: #1d1d1f;
      --muted: #6b7280;
      --line: #d9dde3;
      --bg: #e9ecef;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); color-scheme: light; }
    body {
      font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
      -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: calc(8px + var(--sat)) calc(10px + var(--sar)) 8px calc(10px + var(--sal));
      background: var(--brand); color: #fff; flex: 0 0 auto; z-index: 20;
    }
    header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .ver { font-size: 11px; opacity: .8; background: rgba(255,255,255,.15); padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
    .hbtn {
      border: 0; background: rgba(255,255,255,.16); color: #fff; padding: 8px 12px; border-radius: 9px;
      font-weight: 600; white-space: nowrap; min-height: 38px;
    }
    .hbtn:active { background: rgba(255,255,255,.3); }
    .hbtn.primary { background: #fff; color: var(--brand); }
    .hbtn[disabled] { opacity: .45; pointer-events: none; }
    #toolbar { flex: 0 0 auto; background: #fff; border-bottom: 1px solid var(--line); z-index: 15; }
    .tools { display: flex; justify-content: center; gap: 2px; padding: 4px calc(6px + var(--sar)) 2px calc(6px + var(--sal)); }
    .tool {
      flex: 0 1 76px; min-width: 0; border: 0; background: none; border-radius: 10px; padding: 5px 2px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 1px; color: #374151;
    }
    .tool .ic { font-size: 21px; line-height: 24px; height: 24px; }
    .tool .lb { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .tool.on { background: #fbe9e7; color: var(--brand); }
    .tool[disabled] { opacity: .35; pointer-events: none; }
    .tool .ic.t { font: 700 21px/24px Georgia, "Times New Roman", serif; }
    .sep { width: 1px; background: var(--line); margin: 6px 4px; flex: 0 0 1px; }
    .opts {
      display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
      min-height: 44px; padding: 4px calc(10px + var(--sar)) 6px calc(10px + var(--sal)); border-top: 1px solid #f0f1f3;
    }
    .opts .hint { color: var(--muted); font-size: 13px; text-align: center; }
    .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #c7ccd3; padding: 0; }
    .sw.on { box-shadow: 0 0 0 2px var(--ink); }
    .wd { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
    .wd.on { border-color: var(--ink); background: #f3f4f6; }
    .wd i { display: block; background: var(--ink); border-radius: 99px; width: 18px; }
    .pill { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 11px; min-height: 34px; font-weight: 600; }
    .pill.danger { color: #c62828; border-color: #f2c4c0; }
    .fs { min-width: 44px; text-align: center; font-size: 13px; color: var(--muted); }
    #stage { position: relative; flex: 1 1 auto; min-height: 0; }
    #viewer {
      position: absolute; inset: 0; overflow: auto; background: var(--bg);
      -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; overscroll-behavior: contain;
    }
    #pages { width: max-content; min-width: 100%; padding: 12px calc(12px + var(--sar)) 80px calc(12px + var(--sal)); transform-origin: 0 0; }
    .page { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
    .page canvas.pdfc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .page svg.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .page svg.ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .page svg.ink path.mk { mix-blend-mode: multiply; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .draw { touch-action: none; display: none; }
    body.t-pen .draw, body.t-marker .draw, body.t-eraser .draw, body.t-text .draw { display: block; pointer-events: auto; }
    body.t-pen .draw, body.t-marker .draw { cursor: crosshair; }
    body.t-eraser .draw { cursor: cell; }
    body.t-text .draw { cursor: text; }
    body.t-select .forms > * { pointer-events: auto; }
    body.t-select .objs > .obj, body.t-text .objs > .obj { pointer-events: auto; }
    .ff { position: absolute; border: 0; margin: 0; padding: 0 2px; background: rgba(40, 110, 255, .10); color: #000;
      font-family: Helvetica, Arial, sans-serif; outline: none; border-radius: 1px; -webkit-user-select: text; user-select: text; }
    .ff:focus { background: rgba(40, 110, 255, .18); box-shadow: 0 0 0 1px rgba(40,110,255,.7); }
    textarea.ff { resize: none; line-height: 1.15; padding-top: 1px; }
    select.ff { -webkit-appearance: none; appearance: none; padding-right: 2px; }
    .ff[disabled] { background: transparent; }
    .fchk { display: flex; align-items: center; justify-content: center; line-height: 1; font-weight: 700; padding: 0; }
    .fchk.radio { border-radius: 50%; }
    .fsig { display: flex; align-items: center; justify-content: center; color: #1f4fbf; border: 1px dashed rgba(31,79,191,.6);
      font-weight: 600; overflow: hidden; white-space: nowrap; }
    body.t-select .ff:not(:focus):not([disabled]) { box-shadow: inset 0 0 0 1px rgba(40,110,255,.28); }
    body:not(.t-select) .ff { background: transparent; box-shadow: none; }
    body:not(.t-select) .fsig { border-color: transparent; color: transparent; }
    .obj { position: absolute; }
    .obj.sel { outline: 1.5px dashed #2563eb; outline-offset: 2px; }
    .obj.text textarea {
      display: block; width: 100%; border: 0; margin: 0; padding: 0; background: transparent; resize: none; overflow: hidden;
      font-family: Helvetica, Arial, sans-serif; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; outline: none;
      -webkit-user-select: text; user-select: text; min-height: 1em;
    }
    .obj.text:not(.sel) textarea { box-shadow: inset 0 0 0 1px rgba(37,99,235,.18); }
    .obj.sig img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
    .obj.sig { touch-action: none; cursor: move; }
    .h { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: #fff; border: 2px solid #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; font-size: 14px; line-height: 1;
      touch-action: none; padding: 0; z-index: 2; }
    .obj.sel .h { display: flex; }
    .h.del { top: -18px; right: -18px; background: #dc2626; }
    .h.rs { bottom: -18px; right: -18px; cursor: nwse-resize; }
    .h.mv { top: -18px; left: -18px; cursor: move; }
    #pageind { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(17,24,39,.72); color: #fff;
      font-size: 12px; padding: 3px 10px; border-radius: 99px; pointer-events: none; z-index: 5; display: none; }
    #zoombox { position: absolute; right: calc(12px + var(--sar)); bottom: 12px; display: none; align-items: center; gap: 2px; z-index: 5;
      background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 3px; }
    #zoombox button { border: 0; background: none; width: 38px; height: 36px; border-radius: 9px; font-size: 20px; }
    #zoombox button:active { background: #f1f2f4; }
    #zoombox #zl { width: auto; min-width: 54px; font-size: 13px; font-weight: 600; }
    body.has-doc #pageind, body.has-doc #zoombox { display: flex; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--bg); }
    body.has-doc #empty { display: none; }
    #empty .card { background: #fff; border-radius: 18px; padding: 28px 24px; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    #empty h1 { font-size: 21px; margin: 6px 0 8px; }
    #empty p { color: var(--muted); margin: 0 0 18px; }
    #empty ul { text-align: left; color: #374151; margin: 0 0 20px; padding-left: 20px; }
    .big { border: 0; background: var(--brand); color: #fff; font-weight: 700; font-size: 17px; padding: 14px 26px; border-radius: 13px; }
    .big:active { background: var(--brand-d); }
    #empty .v { margin-top: 16px; font-size: 12px; color: var(--muted); }
    .dlg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100;
      padding: calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal)); }
    .dlg.open { display: flex; }
    .dlg .box { background: #fff; border-radius: 16px; width: 100%; max-width: 640px; max-height: 100%; overflow: auto; padding: 16px; }
    .dlg h2 { margin: 0 0 10px; font-size: 18px; }
    .dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .dlg .row .grow { flex: 1; }
    .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 42px; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    #padwrap { position: relative; border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
    #pad { display: block; width: 100%; height: 220px; touch-action: none; cursor: crosshair; }
    #padwrap .base { position: absolute; left: 7%; right: 7%; bottom: 52px; border-top: 1.5px solid #c9ced6; pointer-events: none; }
    #padwrap .x { position: absolute; left: 7%; bottom: 56px; color: #9aa1ab; font-size: 18px; pointer-events: none; }
    #padwrap .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b7bcc4; pointer-events: none; font-size: 15px; }
    .siglist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .sigitem { position: relative; border: 1px solid var(--line); border-radius: 12px; height: 86px; background: #fff; padding: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .sigitem img { max-width: 100%; max-height: 100%; pointer-events: none; }
    .sigitem .rm { position: absolute; top: 4px; right: 4px; border: 0; background: #f3f4f6; border-radius: 8px; width: 28px; height: 28px; font-size: 14px; }
    .sigitem.new { color: var(--brand); font-weight: 700; border-style: dashed; }
    #toast { position: fixed; left: 50%; bottom: calc(24px + var(--sab)); transform: translateX(-50%) translateY(20px); background: #111827; color: #fff;
      padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .25s; z-index: 200; pointer-events: none; max-width: 90vw; text-align: center; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #busy { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: none; align-items: center; justify-content: center; z-index: 150; font-weight: 600; }
    #busy.open { display: flex; }
    #fileinput { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    @media (max-width: 767px) {
      #toolbar { order: 3; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: var(--sab); display: flex; flex-direction: column; }
      .opts { order: -1; border-top: 0; border-bottom: 1px solid #f0f1f3; }
      .hbtn .lt { display: none; }
      .tool { flex: 1 1 0; }
      .tool { padding-left: 0; padding-right: 0; }
      .tool .lb { font-size: 10px; letter-spacing: -0.2px; text-overflow: clip; }
      .sep { display: none; }
      header .ver { display: none; }
    }
    @media (min-width: 768px) { .hbtn .ls { display: none; } }
  </style>
</head>
<body class="t-select">
  <header>
    <button class="hbtn" id="btnOpen" title="PDF öffnen">📂<span class="lt"> Öffnen</span></button>
    <div class="title" id="title">PDF bearbeiten</div>
    <span class="ver" id="ver"></span>
    <button class="hbtn" id="btnClose" title="Datei schließen" disabled>✕</button>
    <button class="hbtn primary" id="btnExport" disabled>⬆︎<span class="lt"> Exportieren</span><span class="ls"> PDF</span></button>
  </header>
  <div id="toolbar">
    <div class="tools">
      <button class="tool on" data-tool="select"><span class="ic">👆</span><span class="lb">Auswahl</span></button>
      <button class="tool" data-tool="pen"><span class="ic">✏️</span><span class="lb">Stift</span></button>
      <button class="tool" data-tool="marker"><span class="ic">🖍️</span><span class="lb">Marker</span></button>
      <button class="tool" data-tool="eraser"><span class="ic">🧽</span><span class="lb">Radierer</span></button>
      <button class="tool" data-tool="text"><span class="ic t">T</span><span class="lb">Text</span></button>
      <button class="tool" id="btnSig"><span class="ic">✍️</span><span class="lb">Unterschrift</span></button>
      <span class="sep"></span>
      <button class="tool" id="btnUndo" disabled><span class="ic">↶</span><span class="lb">Zurück</span></button>
      <button class="tool" id="btnRedo" disabled><span class="ic">↷</span><span class="lb">Vor</span></button>
    </div>
    <div class="opts" id="opts"></div>
  </div>
  <div id="stage">
    <div id="viewer"><div id="pages"></div></div>
    <div id="pageind">–</div>
    <div id="zoombox">
      <button id="zout" title="Verkleinern">−</button>
      <button id="zl" title="Auf Breite">100 %</button>
      <button id="zin" title="Vergrößern">+</button>
    </div>
    <div id="empty">
      <div class="card">
        <div style="font-size:44px">📄</div>
        <h1>PDF bearbeiten</h1>
        <p>Alles bleibt auf deinem Gerät, nichts wird hochgeladen.</p>
        <ul>
          <li>Markieren und zeichnen</li>
          <li>Unterschreiben</li>
          <li>Formulare ausfüllen und Text einfügen</li>
        </ul>
        <button class="big" id="btnOpen2">PDF öffnen</button>
        <div class="v" id="ver2"></div>
      </div>
    </div>
  </div>
  <input type="file" id="fileinput" accept="application/pdf,.pdf" />

  <div class="dlg" id="dlgChoose">
    <div class="box">
      <h2>Unterschrift einfügen</h2>
      <div class="siglist" id="siglist"></div>
      <div class="row"><button class="btn" data-close>Abbrechen</button></div>
    </div>
  </div>
  <div class="dlg" id="dlgPad">
    <div class="box">
      <h2>Neue Unterschrift</h2>
      <div id="padwrap">
        <canvas id="pad"></canvas>
        <div class="base"></div><div class="x">✕</div>
        <div class="ph" id="padph">Hier unterschreiben</div>
      </div>
      <div class="row">
        <button class="sw on" data-pc="#111827" style="background:#111827" title="Schwarz"></button>
        <button class="sw" data-pc="#1f3fbf" style="background:#1f3fbf" title="Blau"></button>
        <span class="grow"></span>
        <button class="btn" id="padClear">Löschen</button>
        <button class="btn" data-close>Abbrechen</button>
        <button class="btn primary" id="padSave">Speichern &amp; einfügen</button>
      </div>
    </div>
  </div>
  <div class="dlg" id="dlgReady">
    <div class="box" style="max-width:420px;text-align:center">
      <h2>PDF ist fertig</h2>
      <p style="color:var(--muted);margin:0 0 4px" id="readyName"></p>
      <div class="row" style="justify-content:center">
        <button class="btn" data-close>Schließen</button>
        <button class="btn primary" id="readyShare">In Dateien sichern / Teilen</button>
      </div>
    </div>
  </div>
  <div id="busy"><span id="busytext">Bitte warten …</span></div>
  <div id="toast"></div>

  <script src="vendor/pdf-lib.min.js"></script>
  <script type="module" src="app.js?v=1"></script>
</body>
</html>
